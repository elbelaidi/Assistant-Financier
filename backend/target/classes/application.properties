





spring.datasource.url=jdbc:postgresql://localhost:5432/assistant_financier
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=mySecretKey
jwt.expiration=86400000

# Server
server.port=8081

# Enhanced Logging Configuration for Conversation Management
logging.level.com.example.assistantfinancier=DEBUG
logging.level.com.example.assistantfinancier.service.ConversationService=DEBUG
logging.level.com.example.assistantfinancier.controller.ConversationController=DEBUG
logging.level.com.example.assistantfinancier.controller.FinancialController=DEBUG

# Console logging pattern with timestamp and log level
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{userId}] %logger{36} - %msg%n

# File logging for persistent logs (optional)
logging.file.name=logs/assistant-financier.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{userId}] %logger{36} - %msg%n

# Specific log levels for different components
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.security=INFO

# Disable noisy logs
logging.level.org.springframework.jdbc=INFO
logging.level.org.apache.http=INFO
